name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Run Unit Tests (Continuous Integration)
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore -c Release

      - name: Run Unit Tests
        run: dotnet test Tests/EmployeeSystem.Tests/EmployeeSystem.Tests.csproj --no-build -c Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

  # -------------------------------------------------------------
  # Job 2: Publish Artifact (Continuous Delivery Preparation)
  # -------------------------------------------------------------
  publish-artifact:
    name: Publish API
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Web API
        run: dotnet publish Host/Host.csproj -c Release -o ./publish /p:UseAppHost=false

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: employeesystem-api-binary
          path: ./publish

  # -------------------------------------------------------------
  # Job 3: Docker Container Image Validation
  # -------------------------------------------------------------
  docker-build:
    name: Docker Build Validation
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: employeesystem-api:latest
