name: CD Pipeline

on:
  workflow_run:
    workflows: [ "CI Pipeline" ]
    types: [ completed ]
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Publish Deployable API Artifact (Only after CI passes)
  # -------------------------------------------------------------
  publish-artifact:
    name: Publish API Artifact
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish Web API
        run: dotnet publish Host/Host.csproj -c Release -o ./publish /p:UseAppHost=false

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: employeesystem-api-binary
          path: ./publish

  # -------------------------------------------------------------
  # Job 2: Build Production Container Image
  # -------------------------------------------------------------
  docker-release:
    name: Build Release Docker Image
    needs: publish-artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: employeesystem-api:latest
