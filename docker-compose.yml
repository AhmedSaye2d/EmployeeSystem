services:
  # SQL Server Database Service
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: employeesystem-db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong@Passw0rd!\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # RabbitMQ Message Broker Service
  rabbitmq:
    image: rabbitmq:3-management
    container_name: employeesystem-mq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ASP.NET Core Web API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employeesystem-api
    restart: on-failure
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EmployeeSystem;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=true;"
      RabbitMqSettings__Host: "rabbitmq"
      RabbitMqSettings__Port: "5672"
      RabbitMqSettings__Username: "guest"
      RabbitMqSettings__Password: "guest"
    ports:
      - "5000:8080"

volumes:
  sqlserver_data:
